<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>いすゞ KDバンニングシミュレーター</title>
    <meta name="description" content="コンテナ積載最適化シミュレーター。納期を守りながら充填率80%以上を実現する時間軸適応型バンニングレイアウト。">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <div class="logo">ISUZU Vanning Optimizer</div>
            <div class="stepper">
                <div class="step-dot active" id="step-1-nav">1. 読込</div>
                <div class="step-dot" id="step-2-nav">2. 条件</div>
                <div class="step-dot" id="step-3-nav">3. 計算</div>
                <div class="step-dot" id="step-4-nav">4. 結果</div>
            </div>
        </header>

        <main>
            <!-- ====== Step 1: Upload ====== -->
            <section id="step-1" class="step-panel active">
                <div class="glass-card">
                    <h2>荷物リストを読み込む</h2>
                    <p class="subtitle">Excel(.xlsx)をドロップまたは選択してください</p>

                    <div class="upload-zone" id="drop-zone">
                        <div class="upload-icon">📦</div>
                        <p>ここにファイルをドラッグ＆ドロップ</p>
                        <p class="hint">または、クリックして選択</p>
                        <input type="file" id="file-input" hidden accept=".xlsx, .xls">
                    </div>

                    <div style="text-align:center; margin-top:1rem;">
                        <a id="sample-download-link" href="/api/download_template" class="template-link">
                            📥 テンプレートExcelをダウンロード
                        </a>
                    </div>
                </div>
            </section>

            <!-- ====== Step 2: Conditions ====== -->
            <section id="step-2" class="step-panel">
                <div class="glass-card">
                    <h2>条件を設定</h2>
                    <p class="subtitle">基準日と先読み日数を決めて、最適化を実行します</p>

                    <div class="data-badge" id="data-badge">
                        📦 読込済み: <strong id="total-items">0</strong> 件
                    </div>

                    <div id="validation-bar" class="validation-bar" style="display:none;"></div>

                    <div class="condition-row" style="margin-top:1.5rem;">
                        <div class="field">
                            <label>基準日</label>
                            <input type="date" id="base-date" style="width:200px;">
                        </div>
                        <div class="field">
                            <label>何日先まで見るか</label>
                            <input type="number" id="must-window" min="0" max="30" value="7" style="width:100px;">
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-ghost" onclick="showStep(1)">戻る</button>
                        <button class="btn-primary" id="btn-run">最適化を実行</button>
                    </div>
                </div>
            </section>

            <!-- ====== Step 3: Loading ====== -->
            <section id="step-3" class="step-panel">
                <div class="glass-card loading-card">
                    <div class="pulse-ring"></div>
                    <p id="loading-text">最適化計算中...</p>
                </div>
            </section>

            <!-- ====== Step 4: Dashboard ====== -->
            <section id="step-4" class="step-panel">

                <!-- Hero KPI -->
                <div class="kpi-row" id="kpi-row">
                    <div class="kpi-card" id="kpi-card-containers">
                        <div class="kpi-label">コンテナ</div>
                        <div class="kpi-value" id="kpi-containers">0</div>
                        <div class="kpi-unit">本</div>
                        <div class="kpi-delta" id="kpi-containers-delta"></div>
                    </div>
                    <div class="kpi-card" id="kpi-card-alerts">
                        <div class="kpi-label">要確認</div>
                        <div class="kpi-value" id="kpi-alerts">0</div>
                        <div class="kpi-unit">本</div>
                    </div>
                    <div class="kpi-card" id="kpi-card-fillrate">
                        <div class="kpi-label">平均積載率</div>
                        <div class="kpi-value" id="kpi-fillrate">0</div>
                        <div class="kpi-unit">%</div>
                        <div class="kpi-delta" id="kpi-fillrate-delta"></div>
                    </div>
                </div>

                <!-- One-line summary -->
                <div class="summary-line" id="summary-line"></div>

                <!-- Container Grid -->
                <div class="container-grid" id="container-grid"></div>

                <!-- Actions -->
                <div class="dashboard-actions">
                    <button class="btn-ghost" onclick="showStep(2)">🔄 条件変更</button>
                    <button class="btn-primary" id="btn-export" onclick="downloadExcel()">📋 指示書を出力 (Excel)</button>
                </div>

                <!-- Admin Section (hidden by default) -->
                <div class="admin-link">
                    <a href="#" id="admin-toggle" onclick="toggleAdmin(event)">管理者向け分析 ▸</a>
                </div>
                <div class="admin-panel" id="admin-panel">
                    <h3>高度な分析</h3>
                    <div class="condition-row" style="margin-bottom:1rem;">
                        <div class="field">
                            <label>ローリング日数</label>
                            <input type="number" id="rolling-days" min="1" max="90" value="30" style="width:100px;">
                        </div>
                    </div>
                    <div class="admin-btn-row">
                        <button class="btn-ghost" id="btn-rolling">📊 ローリングシミュレーション</button>
                        <button class="btn-ghost" id="btn-scenario">📈 シナリオ比較</button>
                        <button class="btn-ghost" id="btn-export-rolling" style="display:none;" onclick="downloadRollingExcel()">📥 ローリング結果Excel</button>
                    </div>
                    <div id="admin-results" style="margin-top:1rem;"></div>
                </div>
            </section>
        </main>

        <!-- ====== 3D Modal ====== -->
        <div class="modal-overlay" id="modal-3d">
            <div class="modal-content">
                <div class="modal-header">
                    <div>
                        <h3 id="modal-title">3Dレイアウト</h3>
                    </div>
                    <div class="legend">
                        <span><span style="color:#3b82f6;">■</span> 通常</span>
                        <span><span style="color:#10b981;">■</span> 空き埋め</span>
                        <span><span style="color:#ef4444;">■</span> 強制出荷</span>
                        <span><span style="color:#ff0000;font-size:1.1em;">●</span> 重心</span>
                    </div>
                    <button class="modal-close" onclick="close3D()">&times;</button>
                </div>
                <div class="modal-body" id="3d-container">
                    <div class="stats-overlay" id="3d-stats-overlay"></div>
                    <div class="tooltip-3d" id="3d-tooltip"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
